name: medical-data-center-prod

services:
  tidb:
    image: pingcap/tidb:v7.5.1
    restart: unless-stopped
    command:
      - --store=unistore
      - --path=/data/tidb
      - --log-file=/var/log/tidb/tidb.log
    environment:
      TZ: Asia/Shanghai
    volumes:
      - tidb-data:/data/tidb
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:10080/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - mdc-net

  tidb-init:
    image: mysql:8.4
    restart: "no"
    depends_on:
      tidb:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        until mysqladmin ping -h "$$MDC_DB_HOST" -P "$$MDC_DB_PORT" -u "$$MDC_DB_ROOT_USERNAME" --silent; do
          echo "waiting for tidb..."
          sleep 2
        done
        mysql -h "$$MDC_DB_HOST" -P "$$MDC_DB_PORT" -u "$$MDC_DB_ROOT_USERNAME" -e "CREATE DATABASE IF NOT EXISTS \`$$MDC_DB_NAME\` DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_bin; CREATE USER IF NOT EXISTS '$$MDC_DB_USERNAME'@'%' IDENTIFIED BY '$$MDC_DB_PASSWORD'; ALTER USER '$$MDC_DB_USERNAME'@'%' IDENTIFIED BY '$$MDC_DB_PASSWORD'; GRANT ALL PRIVILEGES ON \`$$MDC_DB_NAME\`.* TO '$$MDC_DB_USERNAME'@'%';"
    environment:
      MDC_DB_HOST: tidb
      MDC_DB_PORT: 4000
      MDC_DB_NAME: ${MDC_DB_NAME}
      MDC_DB_ROOT_USERNAME: root
      MDC_DB_USERNAME: ${MDC_DB_USERNAME}
      MDC_DB_PASSWORD: ${MDC_DB_PASSWORD}
    networks:
      - mdc-net

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    networks:
      - mdc-net

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        JAR_FILE: backend/target/medical-data-center.jar
    restart: unless-stopped
    depends_on:
      tidb:
        condition: service_healthy
      tidb-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      MDC_DB_URL: jdbc:mysql://tidb:4000/${MDC_DB_NAME}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      MDC_DB_USERNAME: ${MDC_DB_USERNAME}
      MDC_DB_PASSWORD: ${MDC_DB_PASSWORD}
      MDC_REDIS_HOST: redis
      MDC_REDIS_PORT: 6379
      MDC_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MDC_EXPORT_BASE_PATH: /data/exports
      MDC_JWT_SECRET: ${MDC_JWT_SECRET}
      MDC_JWT_ACTIVE_KID: ${MDC_JWT_ACTIVE_KID}
      MDC_JWT_PREVIOUS_SECRETS: ${MDC_JWT_PREVIOUS_SECRETS:-}
      MDC_OAUTH2_ISSUER: ${MDC_OAUTH2_ISSUER}
      MDC_ALLOWED_ORIGIN_PATTERNS: ${MDC_ALLOWED_ORIGIN_PATTERNS}
      MDC_AES_KEY: ${MDC_AES_KEY}
      MDC_AES_ACTIVE_KEY_VERSION: ${MDC_AES_ACTIVE_KEY_VERSION}
      MDC_AES_PREVIOUS_KEYS: ${MDC_AES_PREVIOUS_KEYS:-}
    volumes:
      - backend-logs:/app/logs
      - backend-exports:/data/exports
      - ../docker/secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - mdc-net

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${MDC_HTTP_PORT:-18081}:80"
      - "${MDC_HTTPS_PORT:-18443}:443"
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../docker/certs:/etc/nginx/certs:ro
    networks:
      - mdc-net

networks:
  mdc-net:
    driver: bridge

volumes:
  tidb-data:
  redis-data:
  backend-logs:
  backend-exports:
