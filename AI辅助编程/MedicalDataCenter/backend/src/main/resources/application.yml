spring:
  application:
    name: medical-data-center-backend
  profiles:
    active: dev
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/medical-center;MODE=MySQL;AUTO_SERVER=TRUE;DATABASE_TO_UPPER=false
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  quartz:
    job-store-type: memory
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  security:
    issuer: medical-data-center
    jwt-secret: change-this-secret-change-this-secret-change-this-secret
    platform-token-minutes: 120
    open-api-token-minutes: 60
    allowed-origin-patterns: http://localhost:5173,http://127.0.0.1:5173
  crypto:
    aes-key: 0123456789abcdef0123456789abcdef
  export:
    dir: ./data/exports
  rate-limit:
    default-capacity: 30
    refill-tokens: 30
    refill-seconds: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
