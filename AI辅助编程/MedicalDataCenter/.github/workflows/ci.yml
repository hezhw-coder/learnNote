name: mdc-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Backend Verify
        run: mvn -B clean verify

      - name: Upload Backend Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend CI Checks
        run: npm run check:ci

      - name: Upload Frontend Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-coverage
          path: frontend/coverage
          if-no-files-found: warn

  compose-smoke:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Compose Smoke
        shell: pwsh
        run: ./scripts/docker-smoke.ps1

      - name: Upload Compose Smoke Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-diagnostics
          path: .artifacts/compose-smoke
          if-no-files-found: warn
